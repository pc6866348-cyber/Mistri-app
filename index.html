function confetti(cv){
  const c = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight; const cols = ["#f59e0b","#ef4444","#22c55e","#3b82f6","#a855f7","#fde047"], t0 = Date.now();
  const P = Array.from({length: 90}, () => ({x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, vr: -.2 + Math.random() * .4, c: cols[Math.floor(Math.random() * cols.length)]}));
  (function f(){ c.clearRect(0, 0, cv.width, cv.height); P.forEach(q => { q.x += q.vx; q.y += q.vy; q.r += q.vr; c.save(); c.translate(q.x, q.y); c.rotate(q.r); c.fillStyle = q.c; c.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); c.restore(); }); if (Date.now() - t0 < 5000 && cv.isConnected) requestAnimationFrame(f); })();
}

function checkCel(uid, old, now){
  const k = "seen" + uid; let seen = null; try { const v = localStorage.getItem(k); seen = v === null ? null : Number(v); localStorage.setItem(k, now); } catch (e) {}
  const from = old !== null ? old : seen; if (from === null || from >= now) return;
  setTimeout(() => { const g = S.giftBags || 100, up = tierOf(now) > tierOf(from);
    if (up) celebrate(tierOf(now), t("cellvl").replace("{t}", t("tiers")[tierOf(now)]));
    else if (Math.floor(now / g) > Math.floor(from / g)) celebrate(tierOf(now), t("celgift").replace("{g}", g)); }, 900);
}

    await setDoc(doc(db,"invites",ph), {name:n, phone:ph, bags:0}); $("an").value = ""; $("ap").value = ""; };
  $("ms").onclick = async () => { const x = $("mt").value.trim(); if (x) { await addDoc(collection(db,"messages"), {text:x, ts:serverTimestamp()}); $("mt").value = ""; } };
  const inv = m => `नमस्ते ${m.name}! ${SHOP} का ऐप आ गया है। कट्टों पर गिफ्ट, ऑर्डर और ऑफर देखने के लिए इसी नंबर से अकाउंट बनाइए: ` + location.origin + location.pathname;
  $("us").onclick = async e => { const d = e.target.dataset, id = d.u || d.id; if (!id) return; const col = d.c, m = [...USERS, ...INV].find(x => x.id === id); if (!m) return;
    if (d.a === "wa") return void window.open("https://wa.me/91" + m.phone + "?text=" + encodeURIComponent(inv(m)), "_blank");
    if (d.a === "sms") return void (location.href = "sms:" + m.phone + "?body=" + encodeURIComponent(inv(m)));
    if (d.a === "ph") return pick(x => updateDoc(doc(db,col,id), {photo:x}));
    if (d.a === "del") { if (confirm(t("delq"))) await deleteDoc(doc(db,col,id)); return; }
    if (d.u) { const n = parseInt($("b-"+id).value); if (n) { const g = S.giftBags || 100, b0 = m.bags || 0; await updateDoc(doc(db,col,id), {bags:increment(n)}); $("b-"+id).value = ""; if (Math.floor((b0 + n) / g) > Math.floor(b0 / g)) showTarget(m, g); } } };
  unsubs.push(onSnapshot(collection(db,"invites"), s => { INV = s.docs.map(d => ({id:d.id, pend:true, ...d.data()})); paint(); }));
  $("ps").onclick = async e => { const rm = e.target.dataset.rm; if (rm) { if (!confirm(t("delq"))) return; try { await updateDoc(doc(db,"settings","shop"), {[rm]: deleteField()}); S = {...S}; delete S[rm]; paint(); } catch (x) { alert("Error: " + (x.code || x.message)); } return; } const k = e.target.dataset.p; if (!k) return; pick(async d => { try { await setDoc(doc(db,"settings","shop"), {[k]:d}, {merge:true}); } catch (x) { alert("Error: " + (x.code || x.message)); } }, k === "banner" ? 800 : 320); };
  $("sv").onclick = async () => { await setDoc(doc(db,"settings","shop"), {giftText:$("gt").value.trim(), giftBags:parseInt($("gb").value) || 100, lv1:parseInt($("sg1").value) || 200, lv2:parseInt($("sg2").value) || 500, lv3:parseInt($("sg3").value) || 1000, lv4:parseInt($("sg4").value) || 2000, ben0:$("sb0").value.trim(), ben1:$("sb1").value.trim(), ben2:$("sb2").value.trim(), ben3:$("sb3").value.trim(), ben4:$("sb4").value.trim(), deliv:$("sdl").value.trim(), ntfy:$("snt").value.trim()}, {merge:true}); $("se").style.color = "#16a34a"; $("se").textContent = t("saved"); setTimeout(() => $("se").textContent = "", 2500); };
  seenOrd = false; unsubs.push(onSnapshot(query(collection(db,"orders"), orderBy("ts","desc"), limit(40)), s => { if (seenOrd) s.docChanges().forEach(ch => { if (ch.type === "added" && !ch.doc.metadata.hasPendingWrites) alertOrder(ch.doc.data()); }); seenOrd = true; ORD = s.docs.map(d => ({id:d.id, ...d.data()})); paint(); }));
  unsubs.push(onSnapshot(collection(db,"users"), s => { USERS = s.docs.filter(d => d.data().role === "mistri").map(d => ({id:d.id, ...d.data()})); paint(); }));
}
function fillSet(){ $("gt").value = S.giftText || ""; $("gb").value = S.giftBags || 100; [1,2,3,4].forEach(i => $("sg" + i).value = S["lv" + i] || [0,200,500,1000,2000][i]); [0,1,2,3,4].forEach(k => $("sb" + k).value = S["ben" + k] || ""); $("sdl").value = S.deliv || ""; $("snt").value = S.ntfy || ("ak" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 6)); }

function paint(){
  head(); if (!ME) return;
  $("oc") && ($("oc").innerHTML = ownerCard());
  $("ml") && ($("ml").innerHTML = msgHtml());
  if (ME.role === "owner") {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
    ["o","p","m","s"].forEach(k => $("p" + k).classList.toggle("hidden", tab !== k));
    const nn = ORD.filter(o => o.status === "new").length; document.querySelector('.tabs button[data-t="o"]').textContent = t("tOrd") + (nn ? " 🔴" + nn : "");
    document.querySelector('.tabs button[data-t="m"]').textContent = t("tMis") + (FEST.some(f => f.date === today()) ? " 🎉" : "");
    $("fl").innerHTML = FEST.slice().sort((a, b) => a.date.localeCompare(b.date)).map(f => `<div class="row" style="margin:8px 0"><div style="flex:1"><b>${esc(f.name)}</b> ${f.date === today() ? `<span class="tag">${t("today")}</span>` : ""}<br><small>${f.date.split("-").reverse().join("-")}</small></div><button class="sm" data-f="send" data-id="${f.id}">${t("sendw")}</button><button class="sm" style="background:#dc2626" data-f="del" data-id="${f.id}">🗑</button></div>`).join("");
    $("ol").innerHTML = ordHtml(ORD, false);
    $("pl").innerHTML = PRO.length ? PRO.map(p => `<div class="card" style="padding:10px"><div class="row"><img class="av" style="border-radius:10px;width:72px;height:72px" src="${p.photo || DEF}"><div style="flex:1"><b>${esc(p.name)}</b> ${p.type ? `<span class="tag">${esc(p.type)}</span>` : ""}<br>${rs(p.price)} / ${esc(p.unit)}</div></div><div class="row" style="margin-top:8px;flex-wrap:wrap">${(p.photos || (p.photo ? [p.photo] : [])).map((x, k) => `<img src="${x}" style="width:46px;height:46px;border-radius:8px;object-fit:cover" data-pa="rp" data-id="${p.id}" data-i="${k}">`).join("")}</div><div class="row" style="margin-top:8px"><button class="sm" style="background:#78716c" data-pa="ph" data-id="${p.id}">📷</button><button class="sm" data-pa="ed" data-id="${p.id}">✏️</button><button class="sm" style="background:#dc2626" data-pa="del" data-id="${p.id}">🗑</button></div></div>`).join("") : `<p>${t("nopro")}</p>`;
    const all = [...USERS, ...INV]; $("us").innerHTML = all.length ? all.map(m => { const c = m.pend ? "invites" : "users"; return `<div class="row" style="margin:12px 0 4px"><img class="av" src="${m.photo || DEF}"><div style="flex:1"><b>${esc(m.name)}</b> · ${esc(m.phone)} ${m.pend ? `<span class="tag">${t("pend")}</span>` : ""}<br>${ICON[tierOf(m.bags || 0)]} ${m.bags} ${t("bagsw")} · ${Math.floor((m.bags || 0)/(S.giftBags||100))} ${t("gift")}</div></div>
      <div class="row" style="flex-wrap:wrap"><button class="sm" data-a="wa" data-id="${m.id}">${t("wa")}</button><button class="sm" data-a="sms" data-id="${m.id}">${t("sms")}</button><button class="sm" style="background:#78716c" data-a="ph" data-id="${m.id}" data-c="${c}">📷</button><button class="sm" style="background:#dc2626" data-a="del" data-id="${m.id}" data-c="${c}">🗑</button></div>
      <div class="row" style="margin-top:6px"><input type="number" placeholder="${t("nb")}" id="b-${m.id}"><button class="sm" data-u="${m.id}" data-c="${c}">${t("addb")}</button></div>`; }).join("") : `<p>${t("nomis")}</p>`;
    $("gp").src = S.giftPhoto || DEF; $("gp").style.display = S.giftPhoto ? "block" : "none"; $("bp").src = S.banner || DEF; $("bp").style.display = S.banner ? "block" : "none";
  } else {
    const ft = FEST.find(x => x.date === today());
    $("bn").innerHTML = (ft ? `<div class="card hero" style="text-align:center;animation:pop .6s"><div style="font-size:42px">🎆</div><b style="font-size:20px">${esc(ft.name)}</b><br>${esc(festTxt(ft, ME))}</div>` : "") + (S.banner ? `<img class="gift" style="margin:0 0 12px;max-height:240px" src="${S.banner}">` : "");
    const g = S.giftBags || 100, into = ME.bags % g, tr = tierOf(ME.bags), nx = tr < 4 ? TH()[tr + 1] : 0;
    $("mc").innerHTML = `<div class="row"><img class="av" src="${ME.photo || DEF}"><div style="flex:1"><small>${t("hello")} 🙏</small><br><b style="font-size:18px">${esc(ME.name)}</b><br><span class="tier">${ICON[tr]} ${t("tiers")[tr]}</span></div>${badge(tr, 54)}</div>
      <div class="num">${ME.bags}</div><div>${t("bags")}</div>
      ${nx ? `<div class="bar" style="margin-top:10px"><div style="width:${Math.min(100, ME.bags / nx * 100)}%"></div></div><small>${t("tnext").replace("{n}", nx - ME.bags).replace("{t}", t("tiers")[tr + 1])}</small>` : `<small>${t("tmax")}</small>`}
      <button class="link" id="cp">${t("photo")}</button>`;
    $("cp").onclick = () => pick(d => updateDoc(doc(db,"users",U.uid), {photo:d}));
    $("gc").innerHTML = `<b>${t("giftnow").replace("{g}", g)}</b> ${esc(S.giftText || "")}${S.giftPhoto ? `<img class="gift" src="${S.giftPhoto}">` : ""}
      <div class="bar" style="margin-top:12px"><div style="width:${into / g * 100}%"></div></div><small>${t("need")} <b>${g - into}</b> · ${t("gifts")} <b>${Math.floor(ME.bags / g)}</b></small>`;
    $("tc").innerHTML = `<b>${t("ben")}</b>` + [0, 1, 2, 3, 4].map(i => `<div class="tr ${i === tr ? "on" : ""}"><b>${ICON[i]} ${t("tiers")[i]}</b> <small>(${TH()[i]}+ ${t("bagsw")})</small>${S["ben" + i] ? "<br>" + esc(S["ben" + i]) : ""}</div>`).join("");
    $("pr").innerHTML = PRO.length ? PRO.map(proCard).join("") : `<p>${t("nopro")}</p>`;
    $("ol").innerHTML = ordHtml(ORD, true);
  }
}

function build(){ ME.role === "owner" ? buildOwner() : buildMistri(); paint(); }

async function claim(user){
  const ph = (user.email || "").split("@")[0];
  try { const iv = await getDoc(doc(db,"invites",ph));
    if (iv.exists()) { const v = iv.data(); await setDoc(doc(db,"users",user.uid), {name:v.name, phone:ph, bags:v.bags || 0, ...(v.photo ? {photo:v.photo} : {}), role:"mistri", created: serverTimestamp()}); deleteDoc(doc(db,"invites",ph)).catch(() => {}); return; } } catch (e) {}
  setTimeout(() => { if (!ME) $("app").innerHTML = `<div class="card"><p>${t("gone")}</p><button class="big" id="lo2">${t("out")}</button></div>`, $("lo2") && ($("lo2").onclick = () => signOut(auth)); }, 3500);
}
onAuthStateChanged(auth, user => {
  stopAll(); U = user; ME = null;
  if (!user) return authView();
  $("out").classList.remove("hidden"); $("app").innerHTML = "<p>...</p>";
  unsubs.push(onSnapshot(doc(db,"settings","shop"), s => { S = s.data() || {}; paint(); }));
  unsubs.push(onSnapshot(collection(db,"festivals"), s => { FEST = s.docs.map(d => ({id:d.id, ...d.data()})); paint(); if (ME && ME.role !== "owner") checkFest(); }));
  unsubs.push(onSnapshot(collection(db,"products"), s => { PRO = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.name||"").localeCompare(b.name||"")); paint(); }));
  unsubs.push(onSnapshot(query(collection(db,"messages"), orderBy("ts","desc"), limit(15)), s => { MSGS = s.docs.map(d => ({id:d.id, ...d.data()})); paint(); }));
  unsubs.push(onSnapshot(doc(db,"users",user.uid), s => { if (!s.exists()) { claim(user); return; } const first = !ME, old = ME ? ME.bags : null; ME = s.data(); first ? build() : paint(); if (ME.role !== "owner") checkCel(user.uid, old, ME.bags || 0); if (first && ME.role !== "owner") setTimeout(checkFest, 1500); }));
});
$("out").onclick = () => signOut(auth);
$("lg").onclick = () => { lang = lang === "hi" ? "en" : "hi"; try { localStorage.setItem("lang", lang); } catch(e){} U ? (ME && build()) : authView(); head(); };
head(); authView();
})().catch(e => { document.getElementById("app").innerHTML = "<p style='color:red;padding:12px'>Error: " + e.message + "</p>"; });
</script>
</body>
</html>
